<div id="mmfakebenchOntology3d" class="mf-ontology">
  <div class="mf-head">
    <div>
      <h2>MMFakeBench research mesh</h2>
      <p class="mf-sub">Concepts · papers · results · ideas · provenance-aware links</p>
    </div>
    <div class="mf-controls">
      <label>Show <select id="mfType"><option value="all">everything</option><option>Concept</option><option>Paper</option><option>Result</option><option>Idea</option></select></label>
      <label>Find <input id="mfSearch" type="search" placeholder="paper or concept"></label>
      <button id="mfSpin" class="btn btn-ghost" type="button" aria-pressed="false">Auto-rotate</button>
    </div>
  </div>
  <div id="mfStage" class="mf-stage" role="img" aria-label="Interactive three-dimensional ontology graph of multimodal misinformation research"></div>
  <div class="mf-foot">
    <div class="mf-legend"><span><i class="mf-dot concept"></i>Concept</span><span><i class="mf-dot paper"></i>Paper</span><span><i class="mf-dot result"></i>Result</span><span><i class="mf-dot idea"></i>Idea</span></div>
    <div id="mfDetail" class="mf-detail" aria-live="polite">Select a node to inspect its claim, provenance, or open research question.</div>
  </div>
</div>
<style>
  #mmfakebenchOntology3d{color:var(--foreground);font-family:var(--font-sans,system-ui,sans-serif);width:100%;}
  #mmfakebenchOntology3d .mf-head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
  #mmfakebenchOntology3d h2{margin:0;font-size:20px;font-weight:500}
  #mmfakebenchOntology3d .mf-sub{margin:3px 0 0;color:var(--muted-foreground);font-size:12px}
  #mmfakebenchOntology3d .mf-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted-foreground)}
  #mmfakebenchOntology3d select,#mmfakebenchOntology3d input{font:inherit;color:var(--foreground);background:var(--background);border:1px solid var(--border);border-radius:6px;padding:6px 8px}
  #mmfakebenchOntology3d input{width:150px}
  #mmfakebenchOntology3d .mf-stage{height:560px;min-height:380px;overflow:hidden;border-radius:10px;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--primary) 10%,transparent),transparent 56%);}
  #mmfakebenchOntology3d .mf-foot{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-top:10px}
  #mmfakebenchOntology3d .mf-legend{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted-foreground);font-size:12px}
  #mmfakebenchOntology3d .mf-legend span{display:inline-flex;gap:5px;align-items:center}
  #mmfakebenchOntology3d .mf-dot{width:9px;height:9px;border-radius:50%;display:inline-block}.mf-dot.concept{background:var(--blue)}.mf-dot.paper{background:var(--purple)}.mf-dot.result{background:var(--orange)}.mf-dot.idea{background:var(--green)}
  #mmfakebenchOntology3d .mf-detail{max-width:560px;color:var(--muted-foreground);font-size:12px;line-height:1.45}
  @media(max-width:620px){#mmfakebenchOntology3d .mf-stage{height:430px}#mmfakebenchOntology3d input{width:120px}}
</style>
<script type="module">
  import ForceGraph3D from 'https://esm.sh/3d-force-graph@1.79.0?bundle';

  const root = document.getElementById('mmfakebenchOntology3d');
  const stage = document.getElementById('mfStage');
  const detail = document.getElementById('mfDetail');
  const typeSelect = document.getElementById('mfType');
  const search = document.getElementById('mfSearch');
  const spin = document.getElementById('mfSpin');
  const colors = {Concept:'var(--blue)',Paper:'var(--purple)',Result:'var(--orange)',Idea:'var(--green)'};
  const colorValue = (type) => getComputedStyle(root).getPropertyValue(colors[type].replace('var(','').replace(')','')).trim() || colors[type];
  const node = (id,type,label,detail,status,year,url) => ({id,type,label,detail,status,year,url});
  const nodes = [
    node('c-core','Concept','Multimodal misinformation','Separate content type, veracity, intent, and modality relation.', 'core'),node('c-veracity','Concept','Claim veracity','Whether a claim is supported, refuted, or not assessable by evidence.','core'),node('c-mismatch','Concept','Image–text mismatch','Cross-modal consistency is a signal, not proof that the claim is false or deceptive.','core'),node('c-unimodal','Concept','Unimodal bias','Text-only or image-only shortcuts can look like multimodal reasoning.','measured'),node('c-source','Concept','Source leakage','Source and path metadata can predict labels; use for audits only.','measured'),node('c-evidence','Concept','Evidence grounding','Retrieve, rank, cite, and track relevant, contradictory, stale, or insufficient evidence.','frontier'),node('c-uncertainty','Concept','Calibration & abstention','Confidence must be evaluated separately from correctness.','frontier'),node('c-duplicates','Concept','Duplicate-aware evaluation','Group near-duplicate text and images before splitting or resampling.','measured'),node('c-attribution','Concept','Attribution & intent','Identify manipulation type, source, or creator intent without treating attribution as veracity.','frontier'),node('c-forensics','Concept','Forensic reasoning','Inspect process and localized cues, not only the final label.','frontier'),node('c-explain','Concept','Inspectable explanation','Link judgments to evidence, questions, localization, and protocol.','frontier'),node('c-retrieval','Concept','Tool-augmented verification','Adaptive retrieval, visual checks, and reasoning tools decompose the decision.','frontier'),
    node('p-mmfb','Paper','MMFakeBench','Mixed-source benchmark with textual, visual, and cross-modal distortions.','source_checked',2025,'https://arxiv.org/abs/2406.08772'),node('p-verite','Paper','VERITE','Benchmark designed to account for unimodal bias.','source_checked',2023,'https://arxiv.org/abs/2304.14133'),node('p-news','Paper','NewsCLIPpings','Image/caption misalignment benchmark.','source_checked',2021,'https://arxiv.org/abs/2104.05893'),node('p-factify','Paper','FACTIFY3M','Multimodal fact verification with 5W explanations.','source_checked',2023,'https://arxiv.org/abs/2306.05523'),node('p-lrq','Paper','LRQ-FACT','Relevant-question generation to drive evidence retrieval.','source_checked',2024,'https://arxiv.org/abs/2410.04616'),node('p-gnn','Paper','Evidence-Grounded GNN','Attention-based graph reasoning over evidence.','source_checked',2025,'https://arxiv.org/abs/2505.18221'),node('p-trust','Paper','TRUST-VL','Question-aware visual features and structured reasoning.','source_checked',2025,'https://arxiv.org/abs/2509.04448'),node('p-mirage','Paper','MIRAGE / MERIT','Agentic web-grounded multimodal verification.','source_checked',2025,'https://arxiv.org/abs/2510.17590'),node('p-t2','Paper','T²Agent','Tool selection with Monte Carlo Tree Search.','source_checked',2026,'https://arxiv.org/abs/2505.19768'),node('p-fake','Paper','Fact or Fake?','Tests whether deepfake detectors help semantic misinformation detection.','source_checked',2026,'https://arxiv.org/abs/2602.01854'),node('p-reform','Paper','REFORM','Cultivating forensic reasoning for generalizable manipulation detection.','source_checked',2026,'https://arxiv.org/abs/2603.01993'),node('p-core','Paper','CORE','Conflict-oriented reasoning for multimodal manipulation detection.','source_checked',2026,'https://arxiv.org/abs/2606.03066'),node('p-notebook','Paper','Verification-Notebook Learning','Source-aware, inspectable verification notebooks.','source_checked',2026,'https://arxiv.org/abs/2607.23581'),node('p-veriagent','Paper','MM-VeriAgent','Reinforcement learning for extensive verification tools.','source_checked',2026,'https://arxiv.org/abs/2609.30698'),node('p-bimi','Paper','BiMiBench','Explainable bilingual misinformation detection and localization.','source_checked',2025,'https://arxiv.org/abs/2506.22930'),node('p-deception','Paper','DeceptionDecoded','Creator-intent and deception cues in multimodal news.','source_checked',2026,'https://arxiv.org/abs/2505.15489'),node('p-pcgr','Paper','PCGR','Probabilistic concept graph reasoning.','source_checked',2026,'https://arxiv.org/abs/2603.25203'),node('p-revr','Paper','ReVR / Dual-Path Concept Reasoning','Coverage plus targeted questioning.','source_checked',2026,'https://arxiv.org/abs/2609.33195'),node('p-empirical','Paper','Large-Scale Empirical Study','What improves multimodal misinformation detection.','source_checked',2026,'https://arxiv.org/abs/2609.30402'),node('p-mad','Paper','MAD-Sherlock','Multi-agent debate for visual misinformation.','source_checked',2025,'https://arxiv.org/abs/2410.20140'),node('p-crave','Paper','CRAVE','Contextual narratives for retrieval-augmented fact checking.','source_checked',2025,'https://arxiv.org/abs/2504.10166'),node('p-insight','Paper','Insight-A','Attribution-aware multimodal misinformation detection.','source_checked',2025,'https://arxiv.org/abs/2511.21705'),node('p-omnivl','Paper','OmniVL-Guard','Unified forgery detection and grounding via balanced RL.','source_checked',2026,'https://arxiv.org/abs/2602.10687'),node('p-bias','Paper','Unveiling Modality Bias','Sample-specific analysis of modality bias.','source_checked',2025,'https://arxiv.org/abs/2511.05883'),node('p-amg','Paper','AMG / MGCA','Attribution multi-granularity benchmark.','source_checked',2025,'https://arxiv.org/abs/2412.14686'),node('p-reddot','Paper','RED-DOT','Relevant evidence detection for multimodal fact checking.','source_checked',2025,'https://arxiv.org/abs/2311.09939'),node('p-ground','Paper','GroundLie360','Grounding misinformation across text, speech, and visuals.','source_checked',2025,'https://arxiv.org/abs/2509.08008'),node('p-uncert','Paper','Uncertainty-aware disentangled representations','Probabilistic shared and modality-specific representations.','source_checked',2025,'https://doi.org/10.1016/j.ipm.2025.104190'),node('p-umfdet','Paper','UMFDet / OmniFake','Unified multimodal misinformation benchmark and baseline.','source_checked',2025,'https://arxiv.org/abs/2509.25991'),
    node('r-laya','Result','Local LAYA val · 4-way macro-F1 20.3%','Text-only, n=1,000, accuracy 25.6%; near chance and below the 30% majority accuracy floor.','calculated'),node('r-fakerecall','Result','Local LAYA val · Fake recall 4.4%','Binary noul accuracy 32.8%; Fake precision 91.2% but recall 4.4%.','calculated'),node('r-source','Result','Source pair predicts label · 95%','Audit-only diagnostic; source metadata is excluded from model inputs.','calculated'),node('r-fusion','Result','Fusion increment · +1.9 macro-F1','Corrected paired group-bootstrap CI −2.1 to +5.9 points; interval includes zero.','calculated'),node('r-shortcut','Result','Style and image stats carry label signal','Construction shortcuts can mimic factual reasoning.','calculated'),node('r-mmfb','Result','MMD-Agent · 4-way macro-F1 61.6%','Reported validation result, n=1,000; protocol differs from local zero-shot LAYA.','reported'),node('r-trust','Result','TRUST-VL · 85.42 macro-F1','MMFakeBench Table 2 reports 87.30 accuracy and 85.42 macro-F1.','reported'),node('r-mirage','Result','MIRAGE/MERIT · 81.65 F1','Reported binary validation F1 on n=1,000; not directly comparable to four-way metrics.','reported'),node('r-t2','Result','T²Agent · 75.9 four-way macro-F1','GPT-4o validation sample; reported with accuracy 75.3.','reported'),node('r-pcgr','Result','PCGR · 56.9 four-way macro-F1','Reported on a custom partition; not a local reproduction.','reported'),node('r-reform','Result','REFORM · 74.9 F1','Reported MMFakeBench validation result.','reported'),node('r-umfdet','Result','UMFDet · 61.74 binary F1 val','Reported transfer result; test 61.70 F1, averaging not stated.','reported'),
    node('i-separate','Idea','Separate veracity, mismatch, intent','Preserve distinct tasks and permit not-assessable outcomes.','proposed'),node('i-calibrate','Idea','Calibrated selective prediction','Test calibration, abstention, and error coverage by distortion type.','proposed'),node('i-sourceheld','Idea','Source-held-out evaluation','Hold out source pairs and near-duplicate groups.','proposed'),node('i-ledger','Idea','Evidence ledger','Store evidence provenance, relevance, contradiction, freshness, and support status.','proposed'),node('i-layavision','Idea','Laya-Vision pilot','Verify image preprocessing and representation access before multimodal claims.','blocked'),node('i-3d','Idea','Ontology as research instrument','Use the graph to inspect which concepts are supported by which protocols.','active'),node('i-transfer','Idea','Cross-source transfer','Compare MMFakeBench with VERITE only after coverage and encoding differences are explicit.','proposed'),node('i-localize','Idea','Localized explanations','Pair verdicts with claim spans, image regions, and evidence links.','proposed')
  ];
  const L = (source,relation,target) => ({source,target,relation});
  const links = [
    L('p-mmfb','reports','r-mmfb'),L('p-verite','frames','c-unimodal'),L('p-news','studies','c-mismatch'),L('p-factify','supports','c-explain'),L('p-lrq','uses','c-evidence'),L('p-gnn','uses','c-evidence'),L('p-trust','reports','r-trust'),L('p-mirage','reports','r-mirage'),L('p-t2','reports','r-t2'),L('p-fake','tests','c-forensics'),L('p-reform','reports','r-reform'),L('p-core','tests','c-mismatch'),L('p-notebook','tests','c-source'),L('p-veriagent','tests','c-retrieval'),L('p-bimi','tests','c-explain'),L('p-deception','tests','c-attribution'),L('p-pcgr','reports','r-pcgr'),L('p-revr','tests','c-retrieval'),L('p-empirical','tests','c-unimodal'),L('p-mad','tests','c-retrieval'),L('p-crave','uses','c-evidence'),L('p-insight','tests','c-attribution'),L('p-omnivl','tests','c-forensics'),L('p-bias','reports','c-unimodal'),L('p-amg','tests','c-attribution'),L('p-reddot','uses','c-evidence'),L('p-ground','tests','c-explain'),L('p-uncert','tests','c-uncertainty'),L('p-umfdet','reports','r-umfdet'),
    L('r-mmfb','evaluates','c-core'),L('r-trust','evaluates','c-core'),L('r-mirage','evaluates','c-veracity'),L('r-t2','evaluates','c-core'),L('r-pcgr','evaluates','c-attribution'),L('r-reform','evaluates','c-forensics'),L('r-umfdet','evaluates','c-veracity'),L('r-laya','evaluates','c-core'),L('r-laya','qualifies','c-unimodal'),L('r-fakerecall','qualifies','c-uncertainty'),L('r-source','supports','c-source'),L('r-shortcut','supports','c-source'),L('r-shortcut','qualifies','c-unimodal'),L('r-fusion','qualifies','c-unimodal'),L('r-fusion','evaluates','c-core'),
    L('c-core','related_to','c-veracity'),L('c-core','related_to','c-mismatch'),L('c-core','related_to','c-attribution'),L('c-mismatch','distinct_from','c-veracity'),L('c-unimodal','related_to','c-source'),L('c-evidence','related_to','c-uncertainty'),L('c-forensics','related_to','c-explain'),L('c-retrieval','related_to','c-evidence'),
    L('i-separate','motivated_by','c-core'),L('i-separate','tests','c-veracity'),L('i-separate','tests','c-mismatch'),L('i-calibrate','tests','c-uncertainty'),L('i-calibrate','motivated_by','r-fakerecall'),L('i-sourceheld','motivated_by','r-source'),L('i-sourceheld','tests','c-source'),L('i-sourceheld','tests','c-duplicates'),L('i-ledger','motivated_by','c-evidence'),L('i-ledger','tests','c-explain'),L('i-layavision','motivated_by','r-laya'),L('i-layavision','tests','c-unimodal'),L('i-3d','motivated_by','c-core'),L('i-3d','motivated_by','r-fusion'),L('i-transfer','motivated_by','p-verite'),L('i-transfer','tests','c-unimodal'),L('i-localize','motivated_by','c-explain'),L('i-localize','uses_method_from','p-ground')
  ];

  const graph = ForceGraph3D()(stage).graphData({nodes,links}).backgroundColor('rgba(0,0,0,0)').showNavInfo(false).nodeLabel(n => `<b>${n.label}</b><br>${n.type}${n.year ? ` · ${n.year}` : ''}<br><small>${n.status || ''}</small>`).nodeColor(n => colorValue(n.type)).nodeVal(n => n.type === 'Concept' ? 10 : n.type === 'Paper' ? 5 : 7).linkColor(l => l.relation === 'qualifies' ? 'rgba(245,158,11,.95)' : l.relation === 'supports' ? 'rgba(34,197,94,.95)' : l.relation === 'reports' ? 'rgba(167,139,250,.95)' : 'rgba(148,163,184,.78)').linkOpacity(0.95).linkWidth(l => l.relation === 'reports' ? 3.2 : l.relation === 'supports' || l.relation === 'qualifies' ? 2.5 : 1.8).linkDirectionalArrowLength(6).linkDirectionalArrowRelPos(1).linkDirectionalParticles(2).linkDirectionalParticleWidth(2.2).linkDirectionalParticleSpeed(0.006).linkLabel(l => `<b>${l.relation}</b>`).onNodeClick(n => { detail.innerHTML = `<strong>${n.label}</strong> <span class="text-muted">· ${n.type}${n.year ? ` · ${n.year}` : ''}</span><br>${n.detail}${n.url ? ` <a href="${n.url}" target="_blank" rel="noreferrer">Open source ↗</a>` : ''}`; graph.cameraPosition({x:n.x*1.5,y:n.y*1.5,z:n.z*1.5},n,900); });
  graph.d3Force('charge').strength(-95).distanceMax(260);
  graph.d3Force('link').distance(l => l.relation === 'related_to' ? 55 : 72);
  let rotating = false;
  spin.addEventListener('click', () => { rotating = !rotating; graph.controls().autoRotate = rotating; graph.controls().autoRotateSpeed = .55; spin.setAttribute('aria-pressed',String(rotating)); spin.textContent = rotating ? 'Stop rotation' : 'Auto-rotate'; });
  function applyFilter(){ const t = typeSelect.value; const q = search.value.trim().toLowerCase(); const keep = n => (t === 'all' || n.type === t) && (!q || `${n.label} ${n.detail}`.toLowerCase().includes(q)); const visible = new Set(nodes.filter(keep).map(n=>n.id)); graph.graphData({nodes:nodes.map(n=>({...n,hidden:!visible.has(n.id)})),links:links.filter(l=>visible.has(l.source.id || l.source) && visible.has(l.target.id || l.target))}); graph.nodeVisibility(n=>!n.hidden); }
  typeSelect.addEventListener('change',applyFilter); search.addEventListener('input',applyFilter);
  window.addEventListener('resize',()=>graph.width(stage.clientWidth).height(stage.clientHeight));
  graph.width(stage.clientWidth).height(stage.clientHeight);
</script>
